# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: agent-framework-agent-with-local-tools-responses
services:
    agent-framework-agent-with-local-tools-responses:
        project: src/agent-framework-agent-with-local-tools-responses
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: An Agent Framework agent with local tools hosted by Foundry.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: tagging-compliance-agent
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        deployments: []
        endpoint: https://soyuliproject2-resource.services.ai.azure.com/api/projects/soyuliproject2
infra:
    provider: microsoft.foundry
